<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - TechSys</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>Oxente mãinha</h2>
            </div>
            <br>
            <br>
            <nav class="menu">
                <a href="#">Cardápio</a>
                <a href="#"></a>
                <a href="#">Servidores</a>
                <a href="#">Relatórios</a>
                <a href="#">Configurações</a>
            </nav>
        </aside>
        <div class="main-wrapper">
            <header class="topbar">
                <h1>Visão Geral do Sistema</h1>
                <div class="user-profile">

                </div>
            </header>

                    <h3>Status do Servidor</h3>
                    <p>Todos os serviços estão operando normalmente com 99.9% de uptime.</p>
                </section>
                <section class="card">
                    <h3>Métricas de Acesso</h3>
                    <p>O tráfego aumentou 15% em relação ao último ciclo de testes.</p>
                </section>
            </main>
        </div>
    </div>

</html>
