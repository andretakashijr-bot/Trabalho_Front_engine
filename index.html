<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria animada</title>

  <link rel="stylesheet" href="style.css">

  <!-- Bibliotecas necessárias para as animações -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <!-- Seu JavaScript deve vir depois das bibliotecas -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="gallery">
    <ul class="cards">
      <li><img id="cuscuz" src="https://totalpass.com/wp-content/uploads/2025/01/cuscuz-de-milho.jpg" alt="."></li>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
      <li>7</li>
      <li>8</li>
      <li>9</li>
      <li>10</li>
    </ul>

    <div class="actions">
      <button class="prev" type="button">Anterior</button>
      <button class="next" type="button">Próximo</button>
    </div>
  </main>
</body>
</html>
